<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Omi 工具箱</title>
<meta name="description" content="Omi 放在 GitHub Pages 的公開網站與工具入口：旅行手帳、行程指南、O-Ne 頻道工具。">
<meta name="theme-color" content="#FFFCF6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1C1A" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="工具箱">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFCF6; --card:#FFFFFF; --ink:#3E3A39; --muted:#7A716B; --line:#EDE4D6;
  --travel:#A8D3E6; --travel-ink:#1F5872; --tool:#DED2ED; --tool-ink:#5A3F7E;
  --other:#B9DAA5; --other-ink:#3B6327; --daily:#F6D27A; --daily-ink:#6B4A00; --fortune:#F2A497; --fortune-ink:#7A2E22; --lock:#F1ECE4; --lock-ink:#6E655C; --accent:#8C5D00; --shadow:0 10px 28px rgba(110,84,40,.10);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#1E1C1A; --card:#292623; --ink:#EEE7DD; --muted:#AFA59A; --line:#3B3631;
  --travel:#2E5466; --travel-ink:#CDE9F5; --tool:#4A3D5E; --tool-ink:#E8DDF6;
  --other:#3C5531; --other-ink:#D7EDC9; --daily:#5C4712; --daily-ink:#F7DE9A; --fortune:#5E2F28; --fortune-ink:#F8CFC6; --lock:#36312C; --lock-ink:#CFC5BA; --accent:#E6B455; --shadow:0 10px 28px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#1E1C1A; --card:#292623; --ink:#EEE7DD; --muted:#AFA59A; --line:#3B3631;
  --travel:#2E5466; --travel-ink:#CDE9F5; --tool:#4A3D5E; --tool-ink:#E8DDF6;
  --other:#3C5531; --other-ink:#D7EDC9; --daily:#5C4712; --daily-ink:#F7DE9A; --fortune:#5E2F28; --fortune-ink:#F8CFC6; --lock:#36312C; --lock-ink:#CFC5BA; --accent:#E6B455; --shadow:0 10px 28px rgba(0,0,0,.35); color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.65}
.wrap{max-width:980px;margin:0 auto;padding-block:40px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.logo{width:64px;height:64px;flex:none}
h1{font-size:clamp(1.8rem,5vw,2.5rem);margin:0;letter-spacing:.02em;text-wrap:balance}
.lead{margin:2px 0 0;color:var(--muted);max-width:60ch}
.section{margin-top:36px}
.section h2{font-size:1.15rem;margin:0 0 14px;display:flex;align-items:center;gap:10px}
.section h2 .dot{width:12px;height:12px;border-radius:50%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;color:inherit;text-decoration:none;box-shadow:var(--shadow);transition:transform .18s ease, box-shadow .18s ease}
.card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:0 16px 34px rgba(110,84,40,.16);outline:none}
.card:focus-visible{border-color:var(--accent)}
.top{display:flex;align-items:center;gap:10px}
.icon{font-size:1.8rem;line-height:1}
.chip{font-size:.75rem;letter-spacing:.06em;padding:3px 10px;border-radius:999px}
.travel .chip{background:var(--travel);color:var(--travel-ink)}
.tool .chip{background:var(--tool);color:var(--tool-ink)}
.other .chip{background:var(--other);color:var(--other-ink)}
.daily .chip{background:var(--daily);color:var(--daily-ink)}
.fortune .chip{background:var(--fortune);color:var(--fortune-ink)}
.one .chip{background:var(--tool);color:var(--tool-ink)}
.health .chip{background:var(--other);color:var(--other-ink)}
.life .chip{background:var(--travel);color:var(--travel-ink)}
.sys .chip{background:var(--other);color:var(--other-ink)}
.other .chip{background:var(--lock);color:var(--lock-ink)}
.grid.ai{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.aicard{padding:16px;gap:12px}
.aicard .top h3{font-size:1rem;white-space:nowrap}
.aicard .chip{white-space:nowrap}
.aicard .chip.lock{margin-left:auto}
.btns{display:flex;gap:8px}
.btn{flex:1;text-align:center;padding:10px 8px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);text-decoration:none;font-size:.95rem;min-height:44px;display:flex;align-items:center;justify-content:center}
.btn:hover,.btn:focus-visible{border-color:var(--accent);outline:none}
.chip.lock{margin-left:6px;background:var(--lock);color:var(--lock-ink)}
.top .chip:first-of-type{margin-left:auto}
.card h3{margin:0;font-size:1.08rem;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:.92rem;flex:1}
.url{font-size:.75rem;color:var(--muted);overflow-wrap:anywhere;opacity:.85}
.note{margin-top:40px;font-size:.85rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:16px}
.empty{color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion: reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <rect x="8" y="20" width="48" height="34" rx="8" fill="#F6D27A" stroke="#3E3A39" stroke-width="2.5"/>
      <path d="M22 20v-5a4 4 0 0 1 4-4h12a4 4 0 0 1 4 4v5" fill="none" stroke="#3E3A39" stroke-width="2.5"/>
      <rect x="8" y="32" width="48" height="6" fill="#F2A497" stroke="#3E3A39" stroke-width="2.5"/>
      <rect x="27" y="29" width="10" height="12" rx="3" fill="#FFFCF6" stroke="#3E3A39" stroke-width="2.5"/>
    </svg>
    <div>
      <h1>Omi 工具箱</h1>
      <p class="lead">我做的網站與工具都在這裡。標「需登入」的要用我的帳號登入才打得開。</p>
    </div>
  </header>
  <main id="list"></main>
  <p class="note">之後在 GitHub 新開的公開網站會自動列在「其他公開網站」。需登入的頁面只有連結在這裡，內容不公開。</p>
</div>
<script>
// 新增網站：在這裡加一筆。cat 只能是 CATS 裡的鍵。
const SITES = [
  { cat:'daily', icon:'📈', name:'Omi Stock Lab', desc:'每日自動選股。登入要在同一個瀏覽器做完。', url:'https://omi-stock-lab.pages.dev', lock:true },
  { cat:'daily', icon:'🔮', name:'命盤合併版', desc:'八字、紫微、西洋占星、人類圖一次看。', url:'https://omi-chart-lab.pages.dev', lock:true },
  { cat:'daily', icon:'☯️', name:'問境', desc:'塔羅（萊德偉特原圖）、雷諾曼、易經六爻、梅花、擲筊，一站問完；紀錄換手機也看得到。', url:'https://omi-chart-lab.pages.dev/wenjing/', lock:true },
  { cat:'daily', icon:'🐱', name:'三貓神諭卡', desc:'三隻貓的神諭卡，抽一張看今天的心情提醒。', url:'https://claude.ai/artifact/SwSxaR3fK2EaztePJD2mvt', lock:true },
  { cat:'daily', icon:'🗂️', name:'O-Ne 字卡工具', desc:'所有影片字卡的總入口：說明卡、對話卡、評分卡、結算卡等。', url:'https://chian0501.github.io/OmiNote/O-Ne-Tools/' },
  { cat:'life', icon:'🏠', name:'河家歡換屋計畫', desc:'換屋的先決條件、時程與比較整理。', url:'https://claude.ai/artifact/HUGC2eQTzvMVdKLLwRYNzt' },
  { cat:'life', icon:'🚢', name:'郵輪旅程手帳', desc:'12 月 MSC 沖繩航程：行事曆、地圖、預算與隨手記帳、攜帶清單。', url:'https://chian0501.github.io/cruise-planner/', repo:'cruise-planner' },
  { cat:'health', icon:'🏃', name:'居家運動跟著做', desc:'跟著動作一步一步做的居家運動。', url:'https://claude.ai/artifact/LJZ9SsTLwUPgC8XhtZTnAY', lock:true },
  { cat:'health', icon:'🥗', name:'減脂餐盤掃描', desc:'拍一盤餐，看份量搭配。', url:'https://claude.ai/artifact/1zoWWPjxh9G9JD2j2BQjmF', lock:true }
];
// 各隻貓的 AI 專案入口（都要登入）
const CATS_AI = [
  { icon:'🐾', name:'TOP能幹貓', claude:'https://claude.ai/code/project/chan_01NAtARvESsbRegzP3Tc94wU', gpt:'https://chatgpt.com/g/g-p-6aea9b4374d081919eb16d01f4786fe6/project' },
  { icon:'💰', name:'賺錢貓', claude:'https://claude.ai/code/project/chan_01226WBKqSmdZvgZ6mzdrDJy', gpt:'https://chatgpt.com/g/g-p-6afed0c526d4819182af8bd11b488279/project' },
  { icon:'🧾', name:'財務貓', claude:'https://claude.ai/code/project/chan_01CKakRWJoHxPiaP2a6Wt64U', gpt:'https://chatgpt.com/g/g-p-6b052206ffc88191948b9d124a8df616/project' },
  { icon:'🔮', name:'命理貓', claude:'https://claude.ai/code/project/chan_01N8dKP57ABZyczGXnFKpgQL', gpt:'https://chatgpt.com/g/g-p-6afed357383481919ea0a902d44f2fb5/project' },
  { icon:'🌿', name:'保健貓', claude:'https://claude.ai/code/project/chan_01Hfx6mqBDWstZvyhuHBfytq', gpt:'https://chatgpt.com/g/g-p-6b0522c1293081918db7314e2274eb42/project' },
  { icon:'🎥', name:'歐涅貓', claude:'https://claude.ai/code/project/chan_01ArS35rfVCMPZJTqJj9YTdJ', gpt:'https://chatgpt.com/g/g-p-6b05230a29748191934cbd590cbe580c/project' }
];
// 不再使用、也不要自動列出的 repo
const HIDE = ['OmiNote'];
const CATS = { daily:'每天會開的', one:'歐涅貓・頻道工具', fortune:'命理貓', health:'保健貓', life:'生活與旅行', sys:'TOP能幹貓・系統看板', other:'其他公開網站' };
const CHIP = { daily:'常用', one:'頻道', fortune:'命理', health:'保健', life:'生活', sys:'系統', other:'網站' };
const DOT = { daily:'var(--daily)', one:'var(--tool)', fortune:'var(--fortune)', health:'var(--other)', life:'var(--travel)', sys:'var(--other)', other:'var(--lock)' };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function aiSection(){
  return '<section class="section"><h2><span class="dot" style="background:var(--accent)"></span>各隻貓的 AI 專案</h2><div class="grid ai">' +
    CATS_AI.map(c => `<div class="card aicard"><div class="top"><span class="icon">${c.icon}</span><h3>${esc(c.name)}</h3><span class="chip lock">🔒 需登入</span></div><div class="btns"><a class="btn" href="${esc(c.claude)}" target="_blank" rel="noopener">Claude</a><a class="btn" href="${esc(c.gpt)}" target="_blank" rel="noopener">ChatGPT</a></div></div>`).join('') +
    '</div></section>';
}
function render(list){
  document.getElementById('list').innerHTML = Object.keys(CATS).map(cat => {
    const items = list.filter(s => s.cat === cat);
    if (!items.length) return '';
    return `<section class="section"><h2><span class="dot" style="background:${DOT[cat]}"></span>${CATS[cat]}</h2><div class="grid">` +
      items.map(s => `<a class="card ${cat}" href="${esc(s.url)}" target="_blank" rel="noopener"><div class="top"><span class="icon">${s.icon}</span><span class="chip">${CHIP[cat]}</span>${s.lock ? '<span class="chip lock">🔒 需登入</span>' : ''}</div><h3>${esc(s.name)}</h3><p>${esc(s.desc)}</p><span class="url">${esc(s.url.replace('https://','').replace(/(artifact\/\w{8})\w+/,'$1…'))}</span></a>`).join('') +
      '</div></section>';
  }).join('') + aiSection();
}
render(SITES);
// 自動補上：GitHub 上有開 Pages、但還沒寫進清單的公開 repo
fetch('https://api.github.com/users/chian0501/repos?per_page=100')
  .then(r => r.ok ? r.json() : [])
  .then(repos => {
    const known = new Set(SITES.map(s => s.repo).filter(Boolean).concat(['chian0501.github.io'], HIDE));
    const extra = repos.filter(r => r.has_pages && !r.private && !r.fork && !known.has(r.name)).map(r => ({
      cat:'other', icon:'🌐', name:r.description || r.name, desc:'新開的公開網站（自動列出）。', url:`https://chian0501.github.io/${r.name}/`
    }));
    if (extra.length) render(SITES.concat(extra));
  }).catch(() => {});
</script>
</body>
</html>
